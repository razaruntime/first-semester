<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile card</title>
    <style> 
    * {
        box-sizing:border-box;
    }
    body {
        font-family:Arial, Helvetica, sans-serif;
        background:lightgray;
        margin:0px;

        /* sticky top bar */
        .navbar {
            background: blue;
            color:white;
            padding: 15px;
            position:sticky;
            top: 0;
            z-index: index 2;}
            /* profile card */
            .card {
                width: 300px;
                background:white;
                border: 2px solid black;

            }


    }
    </style>
</head>
<body>
    <div class="navbar">
        My Profile
    </div>
    <div class="card">
        <div class="avatar"></div>
        <h2>Ahmad Raza khan</h2>
        <p>Btech CSE Students</p>
        <div class="bio">
            I am learning java, htlm and css.
            i want to became a software engineer.
            i enjoy learning new technology.
            my goal is to improve my coding.
        </div>
    </div>
    <div class="card green">
        <div class="avatar"></div>
        <h2>My profile</h2>
        <p> Web Developer</p>
        <div class="bio">
            I love learning web development.
            i practise HTML nad CSS evey day.

        </div>

    </div>

<button class="add">+</button>
    
    
</body>
</html>
