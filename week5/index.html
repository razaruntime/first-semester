<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>
    <style>
        /* css variables*/
        :root {
            --blue:blue;
            --bg: lightblue;
        }
        /* universal selector */
       *{
        margin: 10px;
        font-family:arial;

       }
       /*element selector */
       h1{
        color: var(--blue);
        text-align: center;

       }
       /* id selector */
       #hero {
        background-color: var(--blue);
        color: white;
        padding: 20px;

       }
       p {
        font-size: 16px;
        line-height: 1.5;

       }
    </style>
</head>

<body>
    
    <h1>Welcome to tech club</h1>
    <div id="hero">
        <h2>Exploring new technology</h2>
        <p>learn coding and web development</p>
</div>
<div class="card">
    <h2>About us</h2>
    <p>our club helps student to learn coding</p>
</div>
<div class="card">
    <h2>Upcoming events</h2>
    <p>Coding competition and Web development Workshop</p>
</div>
</body>
</html>
