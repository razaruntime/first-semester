
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard with CSS Grid</title>
    <link rel="stylesheet" href="m.css">
</head>
<body>

    <div class="dashboard">

        <!-- Top Header -->
        <header class="header">
            <h1>My Dashboard</h1>
            <p>Welcome Back, Student!</p>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">🏠 Home</a>
                <a href="#">📊 Dashboard</a>
                <a href="#">📚 Courses</a>
                <a href="#">📁 Projects</a>
                <a href="#">⚙️ Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <h2>Dashboard Overview</h2>

            <div class="card-container">

                <div class="card">
                    <span>👨‍🎓</span>
                    <div>
                        <h3>Students</h3>
                        <p>1,250</p>
                    </div>
                </div>

                <div class="card">
                    <span>📚</span>
                    <div>
                        <h3>Courses</h3>
                        <p>24</p>
                    </div>
                </div>

                <div class="card">
                    <span>📈</span>
                    <div>
                        <h3>Progress</h3>
                        <p>85%</p>
                    </div>
                </div>

                <div class="card">
                    <span>🏆</span>
                    <div>
                        <h3>Achievements</h3>
                        <p>12</p>
                    </div>
                </div>

                <div class="card">
                    <span>💻</span>
                    <div>
                        <h3>Projects</h3>
                        <p>8</p>
                    </div>
                </div>

                <div class="card">
                    <span>⏰</span>
                    <div>
                        <h3>Study Hours</h3>
                        <p>120</p>
                    </div>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 My Dashboard | All Rights Reserved</p>
        </footer>

    </div>

</body>
</html>
